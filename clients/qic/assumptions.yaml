# QIC — Quality Life Insurance Company (Quality Life. QIC)
#
# IMPORTANT — honest status note (read before assuming this "just works"):
# Only the file/sheet names below have been confirmed to exist and match
# PIC's workbook SHAPE closely (same sheet names: MOTOR/FIRE/ACCIDENT/OTHERS
# in the IBNR workbook; Premium & Commission-2025/Paid Claims-2025/
# Outstanding Claims-2025 in the raw data workbook; ULAE Calculation (Rev)
# in the ULAE workbook — QIC and PIC clearly share the same underlying
# actuarial workpaper template). QIC's "Outstanding Claims-2025" sheet has a
# DIFFERENT column layout than PIC's (extra "IFRS 17 Portfolio" and
# "Underwriting Date" columns, Policy Number/Claim Number reversed, amount
# columns at different positions) — engine/data_loader.py's load_ocr() was
# made column-position-independent (searches for header text rather than
# assuming fixed columns) specifically to handle this.
#
# VALIDATED 2026-08-03 — DOES NOT RECONCILE, do not treat as production/
# regulatory-ready. Ran engine.runner.run_nic_summary(client_id="qic")
# against the workbooks configured below and compared to Stallion/Zamara's
# real audited "2025 QIC Actuarial Valuation Report — Final.pdf" (May 2026):
#   Class     AMVS (chain-ladder IBNR + OCR, undiscounted)   Real AVR (Total LIC, discounted BEL+RA)
#   Motor     GHS 42,983,393                                  GHS 24,104,000   (~78% overstated)
#   Fire      GHS 64,132                                      GHS 170,000      (~62% understated)
#   Accident  GHS 884,830                                      GHS 54,000       (>15x overstated)
# Root causes identified so far (not fixed):
#   - Motor: this client's own triangle shows the 2025 origin year's first
#     development-period value (GHS 14.7m) more than double 2024's
#     equivalent point, while premium only grew ~32% over the same period —
#     chain ladder amplifies that anomaly into an inflated ultimate/IBNR.
#     Confirmed this is a real feature of the source triangle, not a
#     parsing bug (raw values read from the sheet were checked directly).
#   - OCR/Accident: the raw Outstanding Claims labels are clean ("MOTOR",
#     "ACCIDENT", "FIRE", "LIABILITY", "AGRIC" — no bucketing corruption),
#     so the gap isn't a label-mapping bug either. AMVS's simple
#     case-reserve + chain-ladder gap is evidently not equivalent to the
#     real actuaries' full IFRS17 discounted BEL/RA methodology for this
#     client — different data vintage and/or actuarial judgement in the
#     real report that this automated pipeline doesn't replicate.
# Not investigated yet: whether the real AVR was built from a cleaner/
# reviewed data cut than the workbooks configured below (this client's
# folder also has a "DATA REVIEWED" tree with a much smaller Outstanding
# Claims file — not the one referenced here).
#
# UPDATE 2026-08-03 — Motor and Fire switched to Bornhuetter-Ferguson (see
# reserving_methods below). Both are driven by the same root cause: chain
# ladder purely extrapolates the latest diagonal via a development factor,
# with no anchor, so a thin/volatile triangle (Fire) or an anomalous latest
# origin year (Motor's 2025 first-development spike, see above) throws it
# off in either direction. BF damps that by blending with an expected loss
# ratio estimated from this client's own premium history. Re-validated
# against the same real AVR after the switch:
#   Class     AMVS before (chain_ladder)          AMVS after (BF)                      Real AVR
#   Motor     GHS 42,983,393  (~78% overstated)    GHS 39,140,158  (~62% overstated)    GHS 24,104,000
#   Fire      GHS 64,132      (~62% understated)   GHS 161,506     (~5% understated)     GHS 170,000
# Fire is now close to reconciled even without discounting. Motor improved
# (78%→62% overstated, ~20% reduction in the absolute dollar gap) but is
# still materially overstated — BF only damps chain ladder's instability,
# it doesn't fix that 2025's own first-development claims figure is
# genuinely elevated relative to its premium growth, which BF's blended
# estimate still partly reflects. Accident is untouched: its gap isn't a
# reserving-method problem (see OCR/Accident note above), so switching its
# method wouldn't address the actual cause.
#
# Reconciliation is still NOT expected to be exact even with BF, and the
# remaining Motor/Fire gap above should NOT be read as "BF is still wrong"
# — AMVS's non-life summary here is undiscounted with no risk adjustment,
# while the real AVR figures are duration-matched DISCOUNTED BEL + RA.
# Discounting alone reduces a liability estimate (money paid later is worth
# less today), so part of the remaining gap is expected to close on its own
# once that layer exists — closing it needs a discounting/RA layer built on
# top of run_nic_summary(), not a further method change (see
# engine/ifrs17_nonlife.py's generate_nonlife_paa_statements() for where
# that already exists for the full statements, just not surfaced through
# run_nic_summary()'s own IBNR figure — see its use_discounting /
# discount_duration_years parameters and load_yield_curve()).
#
# ACCIDENT — flagged for manual review, deliberately NOT fixed in code:
# unlike Motor/Fire, this gap is not a reserving-method problem (chain
# ladder vs BF doesn't apply — Accident's liability here is a raw case
# reserve total, not a triangle projection), so it isn't something a
# method override can address. See class_warnings below, surfaced verbatim
# by run_nic_summary() (by_class["Accident"]["warning"]) and shown on the
# dashboard Reserving page. Any manual adjustment an actuary makes after
# reviewing case reserve adequacy should be recorded via a ReservingNote
# (db.models.ReservingNote, PUT /reserving/notes) — narrative + optional
# adjusted_gross_ibnr/adjusted_net_ibnr — never by silently changing this
# file or the engine's own computed figure.
#
# DATA PROVENANCE — also flagged, also not resolved: see
# data_provenance_warning / data_file_used below.
#
# The actual data FOLDER path is environment-specific and lives outside
# git — see clients/qic/client.yaml (gitignored, local dev only) and the
# QIC_DATA_DIR environment variable (production/Railway).
name: "Quality Life Insurance Company (QIC)"
currency: "GHS"
fx_rate_ghs_usd: 15.50

data_files:
  ibnr_workbook:     "QIC 2025 IBNR Projection.xlsx"
  raw_data_workbook: "2025 QIC Final Data.xlsx"
  upr_dac_workbook:  "2025 QIC UPR & DAC.xlsx"
  upr_dac_sheet:     "UPR Calc"
  ulae_workbook:     "QIC ULAE (2025).xlsx"
  ulae_sheet:        "ULAE Calculation (Rev)"

assumption_overrides: {}

# Per-class reserving method override (default is chain_ladder — see
# engine/clients.py's ClientConfig.reserving_methods and
# engine/runner.py's run_nic_summary()). Motor and Fire use
# Bornhuetter-Ferguson here specifically because chain ladder was validated
# against QIC's real 2025 AVR and found materially off for both — see the
# note above.
reserving_methods:
  Motor: bornhuetter_ferguson
  Fire: bornhuetter_ferguson

# Per-class warning, surfaced verbatim by run_nic_summary() and the
# dashboard Reserving page — see the ACCIDENT note above for why this is a
# review flag, not a code fix.
class_warnings:
  Accident: "Accident class IBNR requires manual case reserve adequacy review before submission — raw case reserves may include amounts subject to actuarial adjustment."

# Which raw_data_workbook file this client's non-life output is actually
# computed from (mirrors data_files.raw_data_workbook above — kept as its
# own field so it can be shown alongside data_provenance_warning without
# the dashboard needing to know which data_files key is "the risky one").
data_file_used: "2025 QIC Final Data.xlsx"
# NOT YET CONFIRMED: whether this is the same data cut Zamara Actuaries
# used for the real, audited "2025 QIC Actuarial Valuation Report - Final"
# (May 2026). This client's own folder structure also has a separate "DATA
# REVIEWED" tree (e.g. 2025 Outstanding Data Reviewed.xlsx) that is
# materially smaller than the file configured above — it is unconfirmed
# whether that reviewed/cleaned data set, this one, or some later
# combination of both is what actually fed the real valuation. This
# ambiguity is a plausible contributor to the Accident and Motor gaps
# documented above. Confirm with QIC or Zamara before treating this
# client's non-life output as reconciled or submission-ready.
data_provenance_warning: "QIC non-life data source not yet confirmed against Zamara's valuation data — see data_file_used and the comment above it."

reinsurance:
  treaty_type: "quota_share"
  notes: "Not yet reviewed against QIC's own reinsurance workbooks — placeholder."
