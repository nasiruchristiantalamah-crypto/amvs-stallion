# ══════════════════════════════════════════════════════════════════════════
# BLANK CLIENT CONFIG TEMPLATE — copy this whole clients/_template/ folder
# to clients/<new_client_id>/ and fill in the fields below.
#
# <new_client_id> should be a short lowercase slug (letters/digits/
# underscores only, matching the folder name) — it's what every API call
# and engine.runner function will use as client_id.
#
# This file (assumptions.yaml) is what makes a client "exist" — see
# engine.clients.list_clients(). It contains nothing machine-specific, so
# it's meant to be committed to git. The actual data folder path for this
# client's non-life Excel workbooks does NOT go here — see client.yaml
# (gitignored, local dev) / <CLIENT_ID>_DATA_DIR environment variable
# (production) instead, described at the bottom of this file.
# ══════════════════════════════════════════════════════════════════════════

name: "TODO — Full legal name of the insurer"
currency: "GHS"
fx_rate_ghs_usd: 15.50

# Non-life workbook file/sheet names, RELATIVE TO the data folder (see
# client.yaml / <CLIENT_ID>_DATA_DIR below). Every key defaults to PIC's
# own naming convention (engine/clients.py's DEFAULT_DATA_FILES) if omitted
# here — only override the keys that are actually different for this
# client. Before assuming a client's files "just work," open them and
# confirm the sheet names below actually exist — see
# clients/qic/assumptions.yaml for an example of a client whose files
# needed several of these overridden. Leave the whole data_files: key out
# entirely if this client is life-only (no non-life reserving data).
data_files:
  ibnr_workbook:     "2025 IBNR Projection (Gross & Net) - Final.xlsx"
  raw_data_workbook: "2025 PIC Final Data.xlsx"
  upr_dac_workbook:  "UPR & DAC (2025).xlsx"
  upr_dac_sheet:     "UPR & DAC"
  ulae_workbook:     "PIC ULAE (2025) - Final.xlsx"
  ulae_sheet:        "ULAE Calculation (Rev)"

# Assumption overrides applied on top of a product's saved assumptions
# (engine/assumptions_store.py). All optional — omit any key to leave that
# product's own saved assumption untouched. Example:
#   assumption_overrides:
#     mortality_loading: -0.25
#     collection_rate: 0.75
assumption_overrides: {}

# Reinsurance structure — documentation of this client's treaty terms.
# Per-rider reinsurance on a specific life product is set in
# products/<name>.yaml instead (engine/product.py's RiderReinsurance);
# this is the client-level non-life treaty summary.
reinsurance:
  treaty_type: "quota_share"   # or "surplus", "excess_of_loss", "none"
  notes: "TODO"

# ══════════════════════════════════════════════════════════════════════════
# Non-life data folder — NOT set here.
#   Local development: copy client.yaml.example (in this same folder) to
#   client.yaml and fill in data_folder with the real path on your machine
#   — client.yaml is gitignored, so it never gets committed.
#   Production (Railway): set an environment variable named
#   <NEW_CLIENT_ID>_DATA_DIR (e.g. PIC_DATA_DIR, QIC_DATA_DIR) — this always
#   takes priority over client.yaml when both are present. See README.md.
#   If neither is set, this client's non-life endpoints return HTTP 503
#   rather than crashing — see api/main.py and
#   engine.clients.ClientConfig.data_dir_available. Life endpoints
#   (pricing, IFRS 17 GMM) don't need a data folder at all and work
#   regardless.
#
# After filling this file in:
#   1. Add at least one product under products/<product_name>.yaml
#      (copy clients/pic/products/whole_life_tier1.yaml as a starting point)
#   2. Save an initial assumptions version:
#        from engine.assumptions import ProductAssumptions
#        from engine.assumptions_store import save_assumptions
#        save_assumptions("<new_client_id>", "<product_name>", ProductAssumptions(...), label="Initial basis")
#   3. Test: engine.runner.run_pricing(client_id="<new_client_id>", product_name="<product_name>", ...)
# ══════════════════════════════════════════════════════════════════════════
