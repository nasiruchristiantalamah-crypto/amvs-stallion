name: "Ghana Family Plus (demo — new rider type + 2 dependants)"
policy_term_years: null
premium_mode: "monthly"
measurement_model: "gmm"

riders:
  - rider_type: "death"
    name: "Death Benefit"
    benefit_main: 15000
    benefit_dependant: 10000
    incidence_basis: "mortality"

  - rider_type: "critical_illness"
    name: "Critical Illness Benefit"
    benefit_main: 8000
    benefit_dependant: 4000
    incidence_basis: "incidence"
    annual_incidence_rate: 0.0035

  - rider_type: "education"
    name: "Education Support Benefit"
    benefit_main: 0
    benefit_dependant: 3000
    incidence_basis: "mortality"
    waiting_period_months: 12

dependants:
  - relationship: "spouse"
    age_offset: -3
    benefit_multiplier: 1.0
  - relationship: "child"
    age: 8
    benefit_multiplier: 0.5
